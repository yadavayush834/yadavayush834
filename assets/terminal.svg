<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Terminal: whoami — Ayush Yadav, backend and applied AI. Currently building jjk-open, MacHypr, Lens and Spirit Clash.">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; }
    .p { fill: #ef4444; font-weight: 700; }
    .path { fill: #60a5fa; font-weight: 700; }
    .cmd { fill: #e5e7eb; }
    .out { fill: #9ca3af; }
    .hi { fill: #f8fafc; font-weight: 700; }
    .arrow { fill: #ef4444; }
    .proj { fill: #93c5fd; font-weight: 700; }
    .web { stroke: #ef4444; stroke-opacity: .16; fill: none; stroke-width: 1.2; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="76" height="30" width="0"><animate attributeName="width" from="0" to="140" begin="0.4s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;28;56;84;112;140" keyTimes="0;.2;.4;.6;.8;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="108" height="30" width="0"><animate attributeName="width" from="0" to="800" begin="1.2s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="150" height="30" width="0"><animate attributeName="width" values="0;40;80;120;160;200;240" keyTimes="0;.17;.33;.5;.67;.83;1" calcMode="discrete" begin="2s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="298" rx="14" fill="url(#bg)" stroke="#1f2937" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="40" rx="14" fill="#151b26"/>
  <rect x="1" y="28" width="858" height="13" fill="#151b26"/>
  <circle cx="26" cy="21" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="21" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="21" r="6.5" fill="#28c840"/>
  <text x="430" y="26" text-anchor="middle" class="mono" style="font-size:13px" fill="#6b7280">ayush@machypr: ~ — zsh</text>

  <!-- spider web, top-right corner -->
  <g class="web" transform="translate(858,42)">
    <path d="M0 0 L-150 0 M0 0 L-140 55 M0 0 L-105 105 M0 0 L-55 140 M0 0 L0 150"/>
    <path d="M-40 0 Q-36 10 -37 15 Q-33 22 -28 28 Q-22 33 -15 37 Q-8 38 0 40"/>
    <path d="M-80 0 Q-73 20 -74 30 Q-66 45 -56 56 Q-44 66 -30 74 Q-15 77 0 80"/>
    <path d="M-120 0 Q-110 30 -111 45 Q-99 67 -84 84 Q-66 99 -45 111 Q-22 116 0 120"/>
  </g>

  <!-- line 1: whoami -->
  <text x="40" y="96" class="mono"><tspan class="p">❯</tspan> <tspan class="path">~</tspan></text>
  <text x="84" y="96" class="mono cmd" clip-path="url(#c1)">whoami</text>

  <!-- line 2: output -->
  <text x="40" y="128" class="mono" clip-path="url(#c2)"><tspan class="hi">ayush yadav</tspan><tspan class="out">  ·  backend &amp; applied AI  ·  delhi, india</tspan></text>

  <!-- line 3: cat now.txt -->
  <text x="40" y="170" class="mono" opacity="0"><animate attributeName="opacity" to="1" begin="1.8s" dur="0.01s" fill="freeze"/><tspan class="p">❯</tspan> <tspan class="path">~</tspan></text>
  <text x="84" y="170" class="mono cmd" clip-path="url(#c3)">cat now.txt</text>

  <!-- line 4: rotating "currently" -->
  <g class="mono" opacity="0">
    <animate attributeName="opacity" to="1" begin="3s" dur="0.3s" fill="freeze"/>
    <text x="40" y="202"><tspan class="arrow">→</tspan><tspan class="out"> building </tspan></text>
    <g transform="translate(150,0)">
      <text y="202" opacity="0"><tspan class="proj">jjk-open</tspan><tspan class="out">  casting hollow purple with hand tracking</tspan>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.22;.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
      <text y="202" opacity="0"><tspan class="proj">machypr</tspan><tspan class="out">  ricing arch + hyprland into macOS</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.25;.47;.5;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
      <text y="202" opacity="0"><tspan class="proj">lens</tspan><tspan class="out">  fingerprinting camera sensors from photo noise</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.5;.72;.75;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
      <text y="202" opacity="0"><tspan class="proj">spirit-clash</tspan><tspan class="out">  an anime arena fighter in C + raylib</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.75;.97;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- prompt + blinking cursor -->
  <g class="mono" opacity="0">
    <animate attributeName="opacity" to="1" begin="3.4s" dur="0.01s" fill="freeze"/>
    <text x="40" y="244"><tspan class="p">❯</tspan> <tspan class="path">~</tspan></text>
    <rect x="84" y="230" width="10" height="19" fill="#e5e7eb">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
